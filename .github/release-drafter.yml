name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: 'Features'
    when:
      labels:
        - 'feature'
        - 'enhancement'
  - title: 'Bug Fixes'
    when:
      labels:
        - 'fix'
        - 'bugfix'
        - 'bug'
  - title: 'Maintenance'
    when:
      labels:
        - 'chore'
        - 'dependencies'
  - type: pre-exclude
    when:
      label: 'skip-changelog'
  - type: version-resolver
    semver-increment: patch
    exclusive: true
    when:
      label: 'dependencies'
  - type: version-resolver
    semver-increment: major
    when:
      label: 'major'
  - type: version-resolver
    semver-increment: minor
    when:
      label: 'minor'
  - type: version-resolver
    semver-increment: patch
    when:
      label: 'patch'
  - type: version-resolver
    semver-increment: patch

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  ## What's Changed
  $CHANGES
